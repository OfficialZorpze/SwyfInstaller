name: Build and publish Custom AI

on:
  push:
    tags:
      - "custom-ai-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example custom-ai-v1.1.6)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    # The Bridge must compile against the game's Unity/Mirror assemblies.
    # Configure a Windows self-hosted runner with the "swyf-game" label and
    # SWYF_GAME_DIR set to the installed Scam With Your Friends directory.
    runs-on: [self-hosted, Windows, X64, swyf-game]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and package
        shell: powershell
        env:
          SWYF_GAME_DIR: ${{ vars.SWYF_GAME_DIR }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SWYF_GAME_DIR)) {
            throw "Set the SWYF_GAME_DIR repository variable to the game install directory on this self-hosted runner."
          }
          ./custom-ai/build.ps1 -GameDir $env:SWYF_GAME_DIR
          if ($LASTEXITCODE -ne 0) { throw "Build/package failed." }
          if (-not (Test-Path "./custom-ai/artifacts/SWYF-Custom-AI-win-x64.zip")) {
            throw "Expected release ZIP was not produced."
          }

      - name: Choose release tag
        id: release
        shell: powershell
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq "tag") { $tag = $env:REF_NAME }
          else { $tag = $env:INPUT_TAG.Trim() }
          if ($tag -notmatch '^custom-ai-v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Tag must look like custom-ai-v1.1.6"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: SWYF Custom AI ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: custom-ai/artifacts/SWYF-Custom-AI-win-x64.zip
