name: Build and publish Custom AI

on:
  push:
    tags:
      - "custom-ai-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example custom-ai-v1.1.7)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    # The Bridge must compile against the game's Unity/Mirror assemblies.
    # Configure a Windows self-hosted runner with the "swyf-game" label and
    # SWYF_GAME_DIR set to the installed Scam With Your Friends directory.
    runs-on: [self-hosted, Windows, X64, swyf-game]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 into runner temp
        shell: powershell
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP ".dotnet"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $installer = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $installer
          & $installer -Channel "10.0" -InstallDir $installDir -NoPath
          $dotnetExe = Join-Path $installDir "dotnet.exe"
          if (-not (Test-Path $dotnetExe)) {
            throw "The .NET installer finished but dotnet.exe was not found at $dotnetExe."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $installDir
          Add-Content -Path $env:GITHUB_ENV -Value "DOTNET_ROOT=$installDir"
          & $dotnetExe --info
          $dotnetExitCode = $LASTEXITCODE
          if ($dotnetExitCode -ne 0) {
            throw ".NET was installed but dotnet --info failed with exit code $dotnetExitCode."
          }

      - name: Diagnose Bridge references and build
        shell: powershell
        env:
          SWYF_GAME_DIR: ${{ vars.SWYF_GAME_DIR }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SWYF_GAME_DIR)) {
            throw "Set the SWYF_GAME_DIR repository variable to the game install directory on this self-hosted runner."
          }

          $managed = Join-Path $env:SWYF_GAME_DIR "Scam With Your Friends_Data\Managed"
          $diagLog = Join-Path $env:RUNNER_TEMP "bridge-ci-diag.log"

          Write-Host "=== Bridge build diagnostics ==="
          Write-Host "Commit: $(git rev-parse HEAD)"
          Write-Host "Game directory: $env:SWYF_GAME_DIR"
          Write-Host "Managed directory: $managed"
          Write-Host "DOTNET_ROOT: $env:DOTNET_ROOT"
          dotnet --info

          foreach ($file in @("UniTask.dll", "netstandard.dll", "UnityEngine.CoreModule.dll")) {
            $path = Join-Path $managed $file
            if (Test-Path $path) {
              Get-Item $path | Select-Object FullName, Length, LastWriteTime
              Get-FileHash $path -Algorithm SHA256
            } else {
              Write-Host "Not found in Managed root: $path"
            }
          }

          Write-Host "=== Resolved MSBuild properties ==="
          dotnet msbuild ./custom-ai/src/Bridge/Bridge.csproj -getProperty:TargetFramework,TargetFrameworkRootPath,NetStandardImplicitPackageVersion,MSBuildSDKsPath,NETCoreSdkVersion "-p:GameDir=$env:SWYF_GAME_DIR"

          Write-Host "=== Diagnostic Bridge compilation ==="
          dotnet build ./custom-ai/src/Bridge/Bridge.csproj -c Release "-p:GameDir=$env:SWYF_GAME_DIR" "-p:RestoreSources=https://api.nuget.org/v3/index.json" -v:diag --nologo *> $diagLog
          $bridgeExitCode = $LASTEXITCODE

          if ($bridgeExitCode -ne 0) {
            Write-Host "=== Relevant compiler/reference resolution lines ==="
            Select-String -Path $diagLog -Pattern "netstandard.dll|UniTask.dll|TargetFramework =|TargetFrameworkRootPath|ReferencePath|ResolveAssemblyReference" |
              Select-Object -First 100
            throw "Diagnostic Bridge compilation failed with exit code $bridgeExitCode. Full log: $diagLog"
          }

          Write-Host "Diagnostic Bridge compilation succeeded."

          ./custom-ai/build.ps1 -GameDir $env:SWYF_GAME_DIR
          if ($LASTEXITCODE -ne 0) { throw "Build/package failed." }
          if (-not (Test-Path "./custom-ai/artifacts/SWYF-Custom-AI-win-x64.zip")) {
            throw "Expected release ZIP was not produced."
          }

      - name: Choose release tag
        id: release
        shell: powershell
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq "tag") { $tag = $env:REF_NAME }
          else { $tag = $env:INPUT_TAG.Trim() }
          if ($tag -notmatch '^custom-ai-v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Tag must look like custom-ai-v1.1.6"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: SWYF Custom AI ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: custom-ai/artifacts/SWYF-Custom-AI-win-x64.zip
